<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWAM NIG LTD | Properties & Real Estate Hub</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .drag-box { position: relative; background: #e2e8f0; border-radius: 9999px; overflow: hidden; user-select: none; }
        .drag-btn { position: absolute; top: 0; left: 0; width: 50px; height: 100%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; border-radius: 9999px; cursor: pointer; transition: background 0.2s; }
        .drag-btn:hover { background: #1d4ed8; }
        .drag-success { background: #16a34a !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xl tracking-wider shadow-md">GN</div>
                <div>
                    <span class="text-xl font-black text-slate-900 tracking-tight">GROWAM</span>
                    <span class="block text-xs font-semibold text-blue-600 uppercase tracking-widest">Nig Ltd Properties</span>
                </div>
            </div>
            
            <nav class="hidden md:flex items-center space-x-8 font-medium text-slate-600">
                <a href="#home" class="hover:text-blue-600 transition">Home</a>
                <a href="#properties" class="hover:text-blue-600 transition">Properties Hub</a>
                <a href="#services" class="hover:text-blue-600 transition">Services</a>
                <a href="#about" class="hover:text-blue-600 transition">About Us</a>
            </nav>

            <div class="flex items-center space-x-4">
                <button id="navAuthBtn" onclick="openAuthModal('signin')" class="px-5 py-2.5 text-sm font-semibold text-blue-600 bg-blue-50 rounded-xl hover:bg-blue-100 transition">Sign In</button>
                <button onclick="openCartModal()" class="relative p-2.5 text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
                    <i class="fa-solid fa-shopping-bag text-lg"></i>
                    <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="relative bg-slate-900 text-white py-24 lg:py-32 overflow-hidden">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://unsplash.com');"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-900/90 to-transparent"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 max-w-3xl">
            <span class="inline-block py-1 px-3 rounded-full bg-blue-600/30 border border-blue-400/30 text-blue-300 text-sm font-semibold mb-6">Verified Real Estate Hub in Nigeria</span>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight mb-6">Find Your Dream Home or Investment Property</h1>
            <p class="text-lg text-slate-300 mb-8 leading-relaxed">Browse verified houses for rent, land parcels, and luxury apartments.</p>
        </div>
    </section>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative overflow-hidden">
            <button onclick="closeAuthModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="flex space-x-4 border-b border-slate-100 pb-4 mb-6" id="authTabsContainer">
                <button id="tabSignin" onclick="toggleAuthTab('signin')" class="text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-2">Sign In</button>
                <button id="tabSignup" onclick="toggleAuthTab('signup')" class="text-lg font-bold text-slate-400 pb-2 hover:text-slate-600">Sign Up</button>
            </div>

            <form id="authMainForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 bg-slate-50">
                </div>
                <div id="passwordFieldContainer">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                    <input type="password" id="authPassword" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 bg-slate-50">
                </div>
                <div class="text-right" id="forgotLinkContainer">
                    <button type="button" onclick="toggleAuthTab('forgot')" class="text-xs font-semibold text-blue-600 hover:underline">Forgot Password?</button>
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition">Continue</button>
            </form>
        </div>
    </div>

    <script>
        let authMode = 'signin';
        function openAuthModal(mode) { document.getElementById('authModal').classList.remove('hidden'); toggleAuthTab(mode); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        
        function toggleAuthTab(mode) {
            authMode = mode;
            const tabSignin = document.getElementById('tabSignin');
            const tabSignup = document.getElementById('tabSignup');
            const passContainer = document.getElementById('passwordFieldContainer');
            const forgotContainer = document.getElementById('forgotLinkContainer');
            const submitBtn = document.getElementById('authSubmitBtn');
            const tabsBox = document.getElementById('authTabsContainer');

            tabsBox.classList.remove('hidden');
            passContainer.classList.remove('hidden');
            forgotContainer.classList.remove('hidden');

            if (mode === 'signin') {
                tabSignin.className = "text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-2";
                tabSignup.className = "text-lg font-bold text-slate-400 pb-2 hover:text-slate-600";
                submitBtn.innerText = "Sign In to Account";
            } else if (mode === 'signup') {
                tabSignin.className = "text-lg font-bold text-slate-400 pb-2 hover:text-slate-600";
                tabSignup.className = "text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-2";
                submitBtn.innerText = "Create Free Account";
            } else if (mode === 'forgot') {
                tabsBox.classList.add('hidden');
                passContainer.classList.add('hidden');
                forgotContainer.classList.add('hidden');
                submitBtn.innerText = "Send Password Reset Email";
            }
        }

        document.getElementById('authMainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (authMode === 'signin') { alert('Sign In simulation active.'); return; }
            const endpoint = authMode === 'signup' ? '/api/signup' : '/api/forgot-password';
            const payload = authMode === 'signup' ? { email, password } : { email };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                alert(data.message);
                if (response.ok) closeAuthModal();
            } catch (error) {
                alert('Connection to backend API failed.');
            }
        });
        function openCartModal() { alert('Your properties portfolio is empty.'); }
    </script>
</body>
</html>
