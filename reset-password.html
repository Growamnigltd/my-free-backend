<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | GROWAM NIG LTD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative">
        <div class="text-center mb-6">
            <div class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow-md">GN</div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Set New Password</h2>
            <p id="userEmailDisplay" class="text-xs text-slate-500 mt-1">Enter a new secure password for your account.</p>
        </div>

        <form id="resetPasswordForm" class="space-y-4" onsubmit="handlePasswordUpdate(event)">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">New Password</label>
                <input type="password" id="newPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 bg-slate-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 bg-slate-50 text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition text-sm">Update Password</button>
        </form>
    </div>

    <script>
        // Extract email parameter from the URL query string
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('userEmailDisplay').innerText = "Resetting password for: " + decodeURIComponent(email);
        }

        function handlePasswordUpdate(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                alert('Passwords do not match. Please re-enter.');
                return;
            }

            alert('Password successfully updated! You can now sign in with your new password.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
